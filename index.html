<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Connecting</title>
  <meta name="description"
    content="Agência especializada em negócios locais: Domínio no Google Maps, Sites de Alta Performance e Atualização Visual Premium." />

  <!-- Favicon -->
  <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
  <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png" />
  <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16x16.png" />
  <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />

  <!-- Hedvig Letters Serif & Geist Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link
    href="https://fonts.googleapis.com/css2?family=Hedvig+Letters+Serif:opsz@12..24&family=Geist:wght@400;500;600&family=Sofia+Sans+Extra+Condensed:wght@500&display=swap"
    rel="stylesheet">
  <script>
    (function () {
      try {
        const saved = localStorage.getItem('theme');
        if (saved === 'dark' || (!saved && window.matchMedia('(prefers-color-scheme: dark)').matches)) {
          document.documentElement.dataset.mode = 'dark';
        } else {
          document.documentElement.dataset.mode = 'light';
        }
      } catch (e) { }
    })();
  </script>
</head>
